<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>CopaBot 2026</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div class="container">

    <header class="header">
      <h1>🏆 CopaBot 2026</h1>
      <p>Seu assistente inteligente sobre a Copa do Mundo</p>
    </header>

    <div id="chat" class="chat">

      <div class="message bot">
        👋 Olá! Sou um especialista em Copa do Mundo.<br><br>

        Posso te ajudar com:
        <br>⚽ Campeões
        <br>🌍 Países participantes
        <br>🏆 Recordes
        <br>🥇 Artilheiros
        <br>📖 História das Copas
        <br>🔥 Curiosidades da Copa 2026

        <br><br>
        O que deseja saber?
      </div>

    </div>

    <div class="input-area">

      <textarea
        id="mensagem"
        rows="1"
        placeholder="Pergunte algo sobre a Copa do Mundo..."
      ></textarea>

      <button id="btnEnviar">
        Enviar ⚽
      </button>

      <button id="btnLimpar">
        Limpar
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
